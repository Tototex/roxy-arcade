name: Build Plugin Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build folder
        run: |
          mkdir -p build/roxy-arcade
          rsync -av ./ build/roxy-arcade/ \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.DS_Store'

      - name: Create zip
        run: |
          cd build
          zip -r roxy-arcade.zip roxy-arcade

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roxy-arcade-plugin
          path: build/roxy-arcade.zip
